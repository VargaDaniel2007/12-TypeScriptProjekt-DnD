<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D characters and classes</title>
    <link rel="stylesheet" href="src/styles/bootstrap.min.css">
    <link rel="stylesheet" href="src/styles/style.css">
    <link rel="icon" type="image/x-icon" href="/src/images/g5686.svg">
</head>

<body>
	<div class="z-n1 w-100 h-100 position-absolute" id="background-div"></div>
    <div id="header">
        <div class="titleDiv">
            <h1>D&D characters and classes</h1>
        </div>

    </div>
    <div id="iconDiv">
        <img src="src/images/g5686.svg">
    </div>

    <div id="main" class="container p-3 min-vh-100">
        <div class="mainButtons w-100">
            <div class="row">
                <div id="characterButton" class="col-6 h-100">
                    <input type="image" src="/src/images/bitkép.svg" name="charButton" class="select-button">
                    <label for="charButton">Characters</label>
                </div>
                <div id="classButton" class="col-6 h-100">
                    <input type="image" src="/src/images/Class.svg" name="classButton" class="select-button">
                    <label for="classButton">Class</label>
                </div>
            </div>
        </div>

		<form id="sort-form" class="row justify-content-center g-2 mt-3 px-2 d-flex w-100">
			<div class="col-md-3">
				<select id="sort-by" class="form-select">
					<option value="name">Name</option>
					<option value="class_id">Class</option>
					<option value="ac">Armor Class</option>
					<option value="hp">Health Points</option>
					<option value="strength">Strength</option>
					<option value="dexterity">Dexterity</option>
					<option value="intelligence">Intelligence</option>
					<option value="wisdom">Wisdom</option>
					<option value="hit_die">Hit Die</option>
				</select>
			</div>

			<div class="col-md-2">
				<select id="sort-order" class="form-select">
					<option value="asc">Ascending</option>
					<option value="desc">Descending</option>
				</select>
			</div>
		</form>
        <div class="row mx-auto px-2 mt-4" id="cards"></div>
    
        <button type="button" class="btn btn-primary specialBtn" id="create-btn" data-bs-toggle="modal" data-bs-target="#createNewCharacterModal">
          Create new
        </button>

				<!-- Character Modal -->
				<div class="modal fade" id="createNewCharacterModal" tabindex="-1" aria-labelledby="createNew" aria-hidden="true">
					<div class="modal-dialog">
						<div class="modal-content">
							<div class="modal-header">
								<h1 class="modal-title fs-5" id="createNewCharacterModalLabel">New Character</h1>
								<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
							</div>
							<div class="modal-body">
								<form id="newCharModal-form">
										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newChar-name" class="col-form-label m-0">Characters' name</label></div>
												<div class="col-auto"><input type="text" name="newCharName" id="newChar-name" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newChar-class" class="col-form-label m-0">Characters' class name</label></div>
												<div class="col-auto"><input type="text" name="newCharclass" id="newChar-class" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newChar-ac" class="col-form-label m-0">Characters' armor class</label></div>
												<div class="col-auto"><input type="number" min="0" name="newCharAc" id="newChar-ac" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newChar-hp" class="col-form-label m-0">Characters' health</label></div>
												<div class="col-auto"><input type="number" min="0" name="newCharHp" id="newChar-hp" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newChar-str" class="col-form-label m-0">Characters' strength</label></div>
												<div class="col-auto"><input type="number" min="0" name="newCharStrength" id="newChar-str" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newChar-dext" class="col-form-label m-0">Characters' dexterity</label></div>
												<div class="col-auto"><input type="number" min="0" name="newCharDexterity" id="newChar-dext" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newChar-int" class="col-form-label m-0">Characters' intelligence</label></div>
												<div class="col-auto"><input type="number" min="0" name="newCharIntelligence" id="newChar-int" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newChar-wisd" class="col-form-label m-0">Characters' wisdom</label></div>
												<div class="col-auto"><input type="number" min="0" name="newCharWisdom" id="newChar-wisd" class="form-control"></div>
										</div>

								</form>
							</div>
							<div class="modal-footer">
								<button type="button" class="btn btn-secondary specialBtn" data-bs-dismiss="modal">Close</button>
								<button type="button" class="btn btn-primary createCharBtn" id="newChar-save-btn" data-bs-dismiss="modal">Create character</button>
							</div>
						</div>
					</div>
				</div>

				<!-- Class modal -->
				<div class="modal fade" id="createNewClassModal" tabindex="-1" aria-labelledby="createNewClassModalLabel" aria-hidden="true">
					<div class="modal-dialog">
						<div class="modal-content">
							<div class="modal-header">
								<h1 class="modal-title fs-5" id="createNewClassModalLabel">New Class</h1>
								<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
							</div>
							<div class="modal-body">
								<form id="newClassModal-form">
										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newClass-name" class="col-form-label m-0">Class' name</label></div>
												<div class="col-auto"><input type="text" name="newClassName" id="newClass-name" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newClass-desc" class="col-form-label m-0">Class' description</label></div>
												<div class="col-auto"><textarea cols="23" name="newClassDesc" id="newClass-desc" class="form-control"></textarea></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newClass-htd" class="col-form-label m-0">Hit to Die</label></div>
												<div class="col-auto"><input type="number" min="0" name="newClassHitToDie" id="newClass-htd" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newClass-action" class="col-form-label m-0">Class' action</label></div>
												<div class="col-auto"><input type="text" name="newClassAction" id="newClass-action" class="form-control"></div>
										</div>

										<div class="row justify-content-between w-100 mb-3">
												<div class="col-auto"><label for="newClass-features" class="col-form-label m-0">Class' features</label></div>
												<div class="col-auto"><input type="text" name="newClassFeatures" id="newClass-features" class="form-control"></div>
										</div>
								</form>
							</div>
							<div class="modal-footer">
								<button type="button" class="btn btn-secondary specialBtn" data-bs-dismiss="modal">Close</button>
								<button type="button" class="btn btn-primary specialBtn" id="newClass-save-btn" data-bs-dismiss="modal">Create class</button>
							</div>
						</div>
					</div>
				</div>
        
  </div>

    <script src="/src/components/bootstrap.min.js"></script>
    <script type="module" src="/src/main.ts"></script>

</body>

</html>
